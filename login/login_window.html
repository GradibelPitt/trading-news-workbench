<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141c28;
      color: #e7edf7;
      font: 14px/1.55 Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .auth-container {
      width: 100%;
      max-width: 340px;
      padding: 28px 24px 22px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .auth-header h3 {
      font-size: 18px;
      font-weight: 720;
      color: #f1f5f9;
    }

    .auth-header p {
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
    }

    .auth-form { display: block; }

    .auth-form.hidden { display: none; }

    .auth-field {
      margin-bottom: 12px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 650;
      color: #94a3b8;
    }

    .auth-field input {
      display: block;
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.65);
      color: #e7edf7;
      font-size: 14px;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .auth-field input:focus {
      border-color: #ff8a1f;
    }

    .auth-submit {
      display: block;
      width: 100%;
      height: 40px;
      margin-top: 16px;
      border: 0;
      border-radius: 6px;
      background: #ff8a1f;
      color: #10131a;
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
      transition: opacity 0.16s ease;
    }

    .auth-submit:hover { opacity: 0.88; }
    .auth-submit:disabled { opacity: 0.5; cursor: default; }

    .auth-error {
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.08);
      color: #f87171;
      font-size: 12px;
      text-align: center;
    }

    .auth-error.hidden { display: none; }

    .auth-switch {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .auth-switch a {
      color: #ff8a1f;
      cursor: pointer;
      text-decoration: none;
      font-weight: 680;
    }

    .auth-switch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h3>账号登录</h3>
      <p>本地交易资讯站</p>
    </div>

    <!-- Login form -->
    <form class="auth-form" id="loginForm" autocomplete="on">
      <div class="auth-field">
        <label for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="username" required />
      </div>
      <div class="auth-field">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password" required />
      </div>
      <div class="auth-error hidden" id="loginError"></div>
      <button type="submit" class="auth-submit" id="loginBtn">登录</button>
    </form>

    <!-- Register form -->
    <form class="auth-form hidden" id="registerForm" autocomplete="on">
      <div class="auth-field">
        <label for="regUsername">用户名</label>
        <input type="text" id="regUsername" placeholder="3-32位 字母/数字/下划线/连字符" autocomplete="username" required />
      </div>
      <div class="auth-field">
        <label for="regPassword">密码</label>
        <input type="password" id="regPassword" placeholder="至少4位" autocomplete="new-password" required />
      </div>
      <div class="auth-field">
        <label for="regConfirm">确认密码</label>
        <input type="password" id="regConfirm" placeholder="再次输入密码" autocomplete="new-password" required />
      </div>
      <div class="auth-error hidden" id="regError"></div>
      <button type="submit" class="auth-submit" id="registerBtn">注册</button>
    </form>

    <p class="auth-switch" id="switchArea">
      <span id="switchToRegister">没有账号？<a href="#" id="showRegisterLink">注册</a></span>
      <span id="switchToLogin" class="hidden">已有账号？<a href="#" id="showLoginLink">登录</a></span>
    </p>
  </div>

  <script>
    const API_BASE = window.parent !== window ? '' : '';

    function showError(formId, message) {
      const el = document.getElementById(formId === 'login' ? 'loginError' : 'regError');
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideErrors() {
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('regError').classList.add('hidden');
    }

    function switchToRegister(e) {
      e.preventDefault();
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('switchToRegister').classList.add('hidden');
      document.getElementById('switchToLogin').classList.remove('hidden');
      hideErrors();
    }

    function switchToLogin(e) {
      e.preventDefault();
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('switchToLogin').classList.add('hidden');
      document.getElementById('switchToRegister').classList.remove('hidden');
      hideErrors();
    }

    function notifyParent(eventType, data) {
      if (window.parent !== window) {
        window.parent.postMessage({ type: eventType, ...data }, window.location.origin);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideErrors();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!username || !password) { showError('login', '请输入用户名和密码'); return; }

      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.code !== 0) { showError('login', data.message || '登录失败'); return; }
        notifyParent('auth-login-success', { username: data.user.username });
      } catch (err) {
        showError('login', '网络错误');
      } finally {
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideErrors();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      const btn = document.getElementById('registerBtn');

      if (!username || !password) { showError('reg', '请填写所有字段'); return; }
      if (password !== confirm) { showError('reg', '两次密码不一致'); return; }
      if (password.length < 4) { showError('reg', '密码至少4个字符'); return; }

      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.code !== 0) { showError('reg', data.message || '注册失败'); return; }
        notifyParent('auth-register-success', { username: data.user.username });
      } catch (err) {
        showError('reg', '网络错误');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('registerForm').addEventListener('submit', handleRegister);
    document.getElementById('showRegisterLink').addEventListener('click', switchToRegister);
    document.getElementById('showLoginLink').addEventListener('click', switchToLogin);
  </script>
</body>
</html>
